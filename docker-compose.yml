version: '3.8'

services:
  ctyun-dashboard:
    # 支持直接根据 Git 仓库在线克隆并自动完成构建（国内构建已自动走 npmmirror 与阿里云 Debian 软件源加速）
    build:
      context: https://github.com/xmsssssss/ctyun-dashboard.git#main
      dockerfile: Dockerfile
    image: ctyun-dashboard:latest
    container_name: ctyun-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - CTYUN_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
